site_name: Security Campaign
site_description: Build an ordered Microsoft cloud security roadmap from customer conditions and goals.
site_url: https://cloud2br-msftlearninghub.github.io/Security-Campaign/
repo_url: https://github.com/Cloud2BR-MSFTLearningHub/Security-Campaign
repo_name: Cloud2BR-MSFTLearningHub/Security-Campaign
docs_dir: docs
site_dir: site
copyright: Copyright &copy; 2026 <a href="https://github.com/Cloud2BR-MSFTLearningHub" target="_blank" rel="noopener">Cloud2BR OSS - Learning Hub</a>
theme:
  name: material
  logo: https://avatars.githubusercontent.com/u/195347873?v=4
  favicon: https://avatars.githubusercontent.com/u/195347873?v=4
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    scheme: default
    primary: blue
    accent: blue
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: markmap
          class: markmap
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
extra_css:
  - assets/css/custom.css
extra_javascript:
  - assets/js/logo-link.js
  - assets/js/external-links.js
  - https://cdn.jsdelivr.net/npm/markmap-autoloader@0.17
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Cloud2BR-MSFTLearningHub
      name: Cloud2BR OSS - Learning Hub
nav:
  - Start here: index.md
  - Decision maps:
      - Identity and access: identity-access.md
      - Endpoints and devices: endpoint-map.md
      - Cloud workloads: cloud-workload-map.md
      - Data and AI: data-ai-map.md
      - Security operations: security-operations-map.md
  - Methodology: overview.md
